name: piper-apk
# The embedded Piper preview build (android/piper + ONNX Runtime + the voice model in assets).
# Separate from godot-apk on purpose: plugin-only pushes must not rebuild the packs, and a
# broken plugin must never block the game's own updates.
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [godot]
    paths:
      - 'android/**'
      - 'godot/hula/export_presets.cfg'
      - 'godot/hula/scripts/piper.gd'
      - '.github/workflows/piper-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VER: 4.6.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1 cmdline-tools;latest'
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VER}-stable_linux.x86_64.zip
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VER}.stable
          unzip -q Godot_v${GODOT_VER}-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VER}.stable/
          mv Godot_v${GODOT_VER}-stable_linux.x86_64 /usr/local/bin/godot 2>/dev/null || sudo mv Godot_v${GODOT_VER}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-piper-1
      - name: Stamp the build number
        run: |
          echo -n "${{ github.run_number }}" > godot/hula/build.txt
          echo -n "${{ github.run_number }}" > godot/hula/version.txt
      - name: Debug keystore and editor settings
        run: |
          cp godot/debug.keystore debug.keystore
          mkdir -p ~/.config/godot godot_tmp
          (cd godot/hula && godot --headless --import || true)
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Install the Android build template
        # --install-android-build-template is only a modifier for --export-*: on its own Godot just runs
        # the game headless and never exits (runs 1 and 2 hung here for over an hour). Pair it with a
        # throwaway export; the template lands in godot/hula/android/build, next to project.godot.
        timeout-minutes: 15
        working-directory: godot/hula
        run: |
          mkdir -p build
          timeout 600 godot --headless --install-android-build-template --export-debug AndroidPiper build/probe.apk || true
          test -f android/build/build.gradle || { echo "build template was not installed"; ls -la android 2>&1; exit 1; }
          ls android/build | head -20
      - name: Cache the Piper model
        uses: actions/cache@v4
        with:
          path: piper-model
          key: piper-ryan-medium-1
      - name: Download the Piper model
        run: |
          mkdir -p piper-model
          [ -s piper-model/en_US-ryan-medium.onnx ] || wget -q -O piper-model/en_US-ryan-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium/en_US-ryan-medium.onnx
          [ -s piper-model/en_US-ryan-medium.onnx.json ] || wget -q -O piper-model/en_US-ryan-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium/en_US-ryan-medium.onnx.json
          ls -la piper-model
      - name: Add Piper sources and model to the Android build
        run: |
          B=godot/hula/android/build
          mkdir -p $B/src/main/assets/piper $B/src/main/java/com/camaresh
          cp piper-model/en_US-ryan-medium.onnx piper-model/en_US-ryan-medium.onnx.json $B/src/main/assets/piper/
          cp -r android/piper/src/main/java/com/camaresh/piper $B/src/main/java/com/camaresh/
      - name: Inject Piper into the Android build
        run: |
          B=godot/hula/android/build
          sed -i 's#</application>#<meta-data android:name="org.godotengine.plugin.v2.Piper" android:value="com.camaresh.piper.PiperPlugin" /></application>#' $B/src/main/AndroidManifest.xml
          grep -q onnxruntime $B/build.gradle || sed -i 's#^dependencies {#dependencies {\n    implementation("com.microsoft.onnxruntime:onnxruntime-android:1.20.0")#' $B/build.gradle
          grep -n "onnxruntime" $B/build.gradle
          grep -n "PiperPlugin" $B/src/main/AndroidManifest.xml
      - name: Export Piper APK
        working-directory: godot/hula
        run: |
          mkdir -p build
          sed -i "s#KEYSTORE_PATH#$GITHUB_WORKSPACE/debug.keystore#" export_presets.cfg
          godot --headless --verbose --export-debug AndroidPiper build/HulaVaqueroPiper.apk
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: HulaVaqueroPiper-${{ github.run_number }}
          path: godot/hula/build/HulaVaqueroPiper.apk
