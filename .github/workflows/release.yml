name: Release
# The primary app is the Godot build. The Godot project lives on the `godot`
# branch; this workflow exports its debug APK. The web build lives in the
# separate `legacy` repo.
on:
  push: { branches: [main] }
  workflow_dispatch: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true   # a newer push supersedes an in-flight build
env:
  GODOT_VER: 4.6.3
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: godot }   # shallow clone: the build never reads git history
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1 cmdline-tools;latest'
      # Godot binary + export templates are ~1 GB together; cache them per version.
      - name: Restore Godot cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VER }}-linux
      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable
          wget -q "$base/Godot_v${GODOT_VER}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VER}-stable_export_templates.tpz"
          unzip -q Godot_v${GODOT_VER}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VER}-stable_export_templates.tpz -d tpl
      - name: Install Godot and export templates
        run: |
          cd ~/godot-dl
          sudo install -m 755 Godot_v${GODOT_VER}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VER}.stable
          cp -r tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VER}.stable/
      - name: Stamp the build number
        run: |
          echo -n "${{ github.run_number }}" | tee godot/hula/build.txt godot/hula/version.txt > /dev/null
      - name: Debug keystore and editor settings
        run: |
          cp godot/debug.keystore debug.keystore   # fixed key, so every new APK installs over the last one
          mkdir -p ~/.config/godot
          (cd godot/hula && godot --headless --import || true)
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Export APK
        working-directory: godot/hula
        run: |
          mkdir -p build
          sed -i "s#KEYSTORE_PATH#$GITHUB_WORKSPACE/debug.keystore#" export_presets.cfg
          godot --headless --verbose --export-debug Android build/HulaVaquero.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HulaVaquero-apk
          path: godot/hula/build/HulaVaquero.apk
          if-no-files-found: error
          retention-days: 14
